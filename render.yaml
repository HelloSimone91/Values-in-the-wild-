databases:
  - name: values-in-the-wild-db
    plan: free

services:
  - type: web
    name: values-in-the-wild
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://valuesinthewild.com,https://www.valuesinthewild.com,https://values-in-the-wild.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: values-in-the-wild-db
          property: connectionString

  - type: web
    name: values-in-the-wild-static
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /guide/category/:category
        destination: /guide/category/:category/index.html
      - type: rewrite
        source: /guide/:value
        destination: /guide/:value/index.html
      - type: rewrite
        source: /guide
        destination: /guide/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /practice
        destination: /practice/index.html
      - type: rewrite
        source: /notes
        destination: /notes/index.html
      - type: rewrite
        source: /feedback
        destination: /feedback/index.html
      - type: rewrite
        source: /debug/analytics
        destination: /debug/analytics/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: https://values-in-the-wild.onrender.com
      - key: NODE_VERSION
        value: 22.14.0
