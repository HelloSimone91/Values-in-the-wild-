databases:
  - name: values-in-the-wild-db
    plan: free

services:
  - type: web
    name: values-in-the-wild
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: values-in-the-wild-db
          property: connectionString
